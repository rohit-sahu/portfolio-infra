name: ci-cd

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  SERVICES: "orders worker"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --global aws-cdk@2.1148.1
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: python -m unittest discover -s services/lambda-test
      - run: mvn --batch-mode --no-transfer-progress test
      - name: Build service images without pushing
        run: |
          for svc in $SERVICES; do
            docker build --tag "portfolio-$svc:verify" "services/$svc"
          done
      - name: Synthesize dev and prod
        working-directory: infra
        run: |
          cdk synth '*' --quiet -c env=dev
          cdk synth '*' --quiet -c env=prod

  publish:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-prefix: ${{ steps.registry.outputs.image-prefix }}
    steps:
      - uses: actions/checkout@v4
      - name: Set GHCR image prefix
        id: registry
        run: echo "image-prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Publish orders and worker images to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_PREFIX: ${{ steps.registry.outputs.image-prefix }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          for svc in $SERVICES; do
            image="$IMAGE_PREFIX/$svc:$GITHUB_SHA"
            docker build --platform linux/amd64 --tag "$image" \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              "services/$svc"
            docker push "$image"
          done
          docker logout ghcr.io
      - name: Verify that ECS can pull both images anonymously
        env:
          IMAGE_PREFIX: ${{ steps.registry.outputs.image-prefix }}
        run: |
          for svc in $SERVICES; do
            image="$IMAGE_PREFIX/$svc:$GITHUB_SHA"
            if ! docker manifest inspect "$image" >/dev/null; then
              echo "::error::Cannot read $image anonymously. Check that the GHCR package exists and is public, then rerun the failed job."
              exit 1
            fi
          done

  deploy-dev:
    needs: publish
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
      image-prefix: ${{ needs.publish.outputs.image-prefix }}

  deploy-prod:
    needs: [publish, deploy-dev]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: prod
      image-prefix: ${{ needs.publish.outputs.image-prefix }}